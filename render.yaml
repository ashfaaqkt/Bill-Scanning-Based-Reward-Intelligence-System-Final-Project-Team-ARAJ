# Render blueprint — Team ARAJ
#
# Two services, because the ML work is Python and the API is Node. The backend
# calls the ML service over HTTP, so the ML service has to come up first; Render
# resolves that automatically from the fromService reference below.
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repository.
#
# THREE THINGS ARE NOT IN THIS FILE AND WILL FAIL THE DEPLOY IF FORGOTTEN.
# All three are marked sync:false below, meaning Render prompts for them rather
# than reading them from here — secrets must never be committed.
#
#   1. GEMINI_API_KEY_1        — OCR returns GEMINI_API_KEY_MISSING without it
#   2. serviceAccountKey.json  — upload as a Render Secret File on the backend,
#                                then set GOOGLE_APPLICATION_CREDENTIALS to its
#                                path. FIREBASE_CONFIG is NOT a substitute: it
#                                supplies project config, not credentials
#   3. The v1.0-fyp release must carry the four model binaries — they are
#      gitignored, so a fresh clone has none. fetch_models.py pulls them at
#      build time from the release named in MODEL_BASE_URL and exits non-zero
#      if a required one is missing, which fails the build loudly rather than
#      deploying a service that silently returns the 0.05 fraud baseline.

services:
  # The ML service is NOT here. It ran on Render until 22 Aug and could not
  # stay: the free tier caps a service at 512 MB, and torch alone is ~250 MB
  # resident before the checkpoint loads. The instance was OOM-killed the first
  # time /ml/fraud-score imported torch, which the backend saw only as three
  # simultaneous "unreachable" warnings. It now runs on Cloud Run with 2 GB --
  # see ML_SERVICE_URL below and ml-service/Dockerfile.

  # ── Backend API — also serves the frontend ────────────────────────────────
  - type: web
    name: araj-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: "npm ci --omit=dev"
    startCommand: "npm start"
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Render injects PORT; server.js already reads it.
      #
      # The ML service runs on Cloud Run, not on Render.
      #
      # It was here, and it could not stay. Free Render web services are capped
      # at 512 MB; torch is ~250 MB resident before the checkpoint loads, and
      # OpenCV, pandas and scikit-learn sit on top. The instance was killed the
      # first time /ml/fraud-score imported torch -- Render's event timeline
      # recorded "Instance failed" at 20:11 on 22 Aug, the same minute the
      # backend logged the fraud, profile and recommend calls as unreachable.
      #
      # The failure was silent: all three calls degrade rather than error, so
      # the upload still succeeded and the receipt was stored as Low risk with
      # the 0.05 baseline, no signals and no perceptual hash. A receipt that had
      # never been checked was indistinguishable from one that passed.
      #
      # Cloud Run gives 2 GB, and the tamper CNN returns real probabilities
      # there. Also note this is not `fromService` -- Render's private network
      # is unavailable between free web services, and the earlier internal
      # address failed with "getaddrinfo ENOTFOUND araj-ml-service".
      - key: ML_SERVICE_URL
        value: "https://araj-ml-service-1012478382071.asia-southeast1.run.app"
      - key: JWT_SECRET
        generateValue: true       # Render generates and stores a strong secret
      # Upload serviceAccountKey.json as a Secret File on this service, then set
      # this to the path Render mounts it at.
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false

# ── A note on the free tier, for demo day ────────────────────────────────────
# Free Render services sleep after 15 minutes idle and take ~50s to wake. Both
# services sleep independently, so the first upload after a quiet spell can pay
# that twice. Open both URLs a few minutes before demonstrating, or keep the
# recorded demo ready — which is why it exists.
